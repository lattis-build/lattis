SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 8388608
SecRequestBodyNoFilesLimit 8388608
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogType Serial
# A and Z exclude request/response headers, bodies and matched secret values.
SecAuditLogParts AZ
SecAuditLog /var/log/modsecurity/lattis-audit.log
SecDebugLogLevel 0
SecRule REQUEST_HEADERS:Content-Type "(?i)^application/json(?:;|$)" \
    "id:1000100,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQBODY_ERROR "!@eq 0" \
    "id:1000101,phase:2,deny,status:400,nolog,msg:'Malformed request body'"
Include /etc/lattis-edge/crs/crs-setup.conf
Include /etc/lattis-edge/crs/rules/*.conf
