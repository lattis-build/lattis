# Deployment template: requires Nginx's ModSecurity v3 connector, CRS,
# operator-provisioned certificates and a private origin. Not installed here.
load_module modules/ngx_http_modsecurity_module.so;
worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    server_tokens off;
    log_format lattis '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/lattis-access.log lattis;
    error_log /var/log/nginx/lattis-error.log warn;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 8m;
    limit_req_zone $binary_remote_addr zone=lattis_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=lattis_auth:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=lattis_connections:10m;
    upstream lattis_app { server 127.0.0.1:4100; }
    upstream lattis_admin { server 127.0.0.1:4300; }
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        server_name app.example.invalid;
        ssl_certificate /etc/lattis-edge/tls/app/fullchain.pem;
        ssl_certificate_key /etc/lattis-edge/tls/app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        modsecurity on;
        modsecurity_rules_file /etc/lattis-edge/modsecurity.conf;
        include /etc/lattis-edge/proxy-common.conf;
        location ^~ /api/auth/ {
            limit_req zone=lattis_auth burst=5 nodelay;
            proxy_pass http://lattis_app;
        }
        location = /api/migrations/media {
            limit_req zone=lattis_api burst=5 nodelay;
            client_max_body_size 18m;
            modsecurity_rules 'SecRequestBodyLimit 18874368
                               SecRequestBodyNoFilesLimit 18874368';
            proxy_pass http://lattis_app;
        }
        # Binary MP4 has its own authenticated streaming parser and size limits.
        # Only this exact upload path skips WAF request-body parsing. Headers,
        # connection limits and all other request rules remain enabled.
        location ~ ^/api/videos/[0-9a-fA-F-]{36}/file$ {
            limit_except PUT { deny all; }
            client_max_body_size 2g;
            proxy_request_buffering off;
            modsecurity_rules 'SecRequestBodyAccess Off';
            proxy_pass http://lattis_app;
        }
        location / {
            limit_req zone=lattis_api burst=30 nodelay;
            proxy_pass http://lattis_app;
        }
    }
    server {
        listen 443 ssl;
        server_name admin.example.invalid;
        ssl_certificate /etc/lattis-edge/tls/admin/fullchain.pem;
        ssl_certificate_key /etc/lattis-edge/tls/admin/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        modsecurity on;
        modsecurity_rules_file /etc/lattis-edge/modsecurity.conf;
        include /etc/lattis-edge/proxy-common.conf;
        client_max_body_size 100k;
        location ^~ /api/auth/ {
            limit_req zone=lattis_auth burst=5 nodelay;
            proxy_pass http://lattis_admin;
        }
        location / {
            limit_req zone=lattis_api burst=30 nodelay;
            proxy_pass http://lattis_admin;
        }
    }
}
